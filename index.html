<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator | Uzi Solutions</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Generate a <br> <span>Random Password</span></h1>
            <div class="display">
                <input type="text" id="password" placeholder="Password">
                <span id="copied">Copied!</span>
                <img src="images/copy.png" id="copy">
            </div>
        <div class="length-box">
            <label for="length"> Length: <span id="length-value">12</span></label>
            <input type="range" id="length" min="8" max="32" value="12">
        </div>
        <button><img src="images/generate.png"> Generate Password</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
